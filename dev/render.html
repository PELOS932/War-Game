<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Renderer Dev Harness</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0a1420; overflow: hidden; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    #hud { position: absolute; left: 8px; top: 8px; color: #dfe8f0; font: 12px/1.35 ui-monospace, monospace; background: rgba(8,14,22,0.72); padding: 6px 8px; border-radius: 4px; pointer-events: none; white-space: pre; z-index: 20; }
    #panel { position: absolute; right: 8px; top: 8px; color: #dfe8f0; font: 12px system-ui; background: rgba(8,14,22,0.72); padding: 6px 8px; border-radius: 4px; z-index: 20; display: flex; flex-direction: column; gap: 4px; }
    #panel label { display: flex; gap: 6px; align-items: center; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #cfe; font: 16px system-ui; z-index: 30; background: #0a1420; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="hud"></div>
  <div id="panel"></div>
  <div id="loading">Loading…</div>
  <script type="module" src="/src/render/dev/main.ts"></script>
</body>
</html>
